# Локальный стенд: n8n + PostgreSQL.
#
# Нужен, чтобы проверять собранные потоки до того, как они попадут на прод.
# Данные лежат в именованных томах и переживают перезапуск.
#
#   cp .env.example .env
#   docker compose up -d
#   → http://localhost:5678

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # n8n стартует раньше базы и падает — ждём готовности явно.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}

      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: ${TZ:-Europe/Moscow}

      # Публичный API — через него работает деплой.
      N8N_PUBLIC_API_DISABLED: "false"

      # Шифрование креденшелов: без фиксированного ключа n8n генерирует новый
      # при пересоздании контейнера, и все сохранённые доступы перестают читаться.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-local-dev-key-change-me}

      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data:
